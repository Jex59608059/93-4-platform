<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>優化版月曆 - 發布版 CSV</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
   
  <style>
  /* 隱藏 Scrollbar 但保留滾動功能 */
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .hide-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .empty-day {
    background: transparent !important;
    border: none !important;
    pointer-events: none;
    box-shadow: none;
  }

  .calendar-widget {
    background: linear-gradient(135deg, #5A827E, #5A827E, #5A827E);
    color: #f1f1f1;
    font-family: sans-serif;
    padding: 1.5rem;
    width: 100%;
    max-width: 64rem;
    margin: auto;
    box-sizing: border-box;
    position: relative;
  }

  .calendar-widget select,
  .calendar-widget button {
    background: linear-gradient(90deg, #FAFFCA, #FAFFCA);
    color: black;
  }

  .calendar-widget select:hover,
  .calendar-widget button:hover {
    background: linear-gradient(90deg, #84AE92, #FAFFCA);
  }

  .calendar-widget #calendarDays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.5rem;
  }

  .calendar-day {
    width: 100%;
    height: 120px; 
    position: relative;
    background-color: #B9D4AA;
    border: 1px solid #4b5563;
    border-radius: 0.5rem;
    font-size: 1rem;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: default;
  }

  @media (min-width: 768px) {
      .calendar-day {
        aspect-ratio: 1 / 1;
        height: auto; 
        min-height: 120px;
      }
  }

  .calendar-day:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    z-index: 20;
    border-color: #FAFFCA;
  }

  .calendar-day .day-number {
    font-size: 3.5rem;
    opacity: 0.15;
    font-weight: 900;
    position: absolute;
    bottom: -5px;
    right: 5px;
    z-index: 0;
    color: #000;
    pointer-events: none;
    line-height: 1;
  }

  .day-content-scroll {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 0.25rem;
    padding-bottom: 1.5rem;
    overflow-y: auto;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  /* Tooltip 樣式 */
  #personnel-tooltip {
    position: fixed;
    background-color: rgba(0, 0, 0, 0.85);
    color: #FAFFCA;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    pointer-events: none;
    z-index: 9999;
    display: none;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    border: 1px solid #5A827E;
    max-width: 200px;
    white-space: normal;
    text-align: center;
  }

  @media (max-width: 1200px) {
    .calendar-widget { padding: 1rem; }
    #calendarDays { gap: 0.2rem; }
    .calendar-day { height: 100px; }
  }
  
  @media (max-width: 768px) {
    .calendar-widget { padding: 0.5rem; }
    .calendar-day { height: 90px; }
    .calendar-day .day-number { font-size: 2rem; }
  }

</style>
</head>
<body>
  <!-- 懸浮提示框 -->
  <div id="personnel-tooltip"></div>

  <div id="calendar-widget" class="calendar-widget text-white">
    <!-- 人員選擇 -->
    <div class="mb-6">
      <label for="personnel" class="block text-sm font-medium text-gray-300 mb-2">選擇人員</label>
      <select id="personnel" class="w-full md:w-64 px-4 py-2 border border-gray-500 rounded-md shadow-sm focus:border-pink-400 focus:ring focus:ring-pink-200 focus:ring-opacity-50">
        <option value="" disabled selected>載入中...</option>
      </select>
    </div>

    <!-- 日曆導航 -->
    <div class="flex justify-between items-center mb-6">
      <button id="prevMonth" class="flex items-center px-4 py-2 rounded-md transition-colors text-sm md:text-base font-bold">
        &lt; 上個月
      </button>
      <h2 id="currentMonth" class="text-lg md:text-xl font-bold">載入中...</h2>
      <button id="nextMonth" class="flex items-center px-4 py-2 rounded-md transition-colors text-sm md:text-base font-bold">
        下個月 &gt;
      </button>
    </div>

    <!-- 日曆 -->
    <div id="calendar">
      <div class="grid grid-cols-7 gap-1 mb-2 text-center">
        <div class="font-medium text-grassgreen-300">日</div>
        <div class="font-medium text-grassgreen-300">一</div>
        <div class="font-medium text-grassgreen-300">二</div>
        <div class="font-medium text-grassgreen-300">三</div>
        <div class="font-medium text-grassgreen-300">四</div>
        <div class="font-medium text-grassgreen-300">五</div>
        <div class="font-medium text-grassgreen-300">六</div>
      </div>
      <div id="calendarDays"></div>
    </div>
  </div>

  <script>
(async function () {
  // 使用您提供的「發布到網路」CSV 連結
  const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTKfhjKiXBd-DURNZJFM2sVrTLvYqI3TDSmgPu3yIO8DvR6vLgGKys4jfiBIYkbfCSBIUBJ_Pot2PDK/pub?gid=0&single=true&output=csv';
  
  let submissionData = {};
  let currentDate = new Date();
  let selectedFormSource = '';
  
  const tooltip = document.getElementById('personnel-tooltip');

  // CSV 解析器：處理引號與逗號
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let current = "";
    let inQuote = false;
    
    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i+1];
        
        if (inQuote) {
            if (char === '"' && nextChar === '"') {
                 current += '"';
                 i++; 
            } else if (char === '"') {
                inQuote = false;
            } else {
                current += char;
            }
        } else {
            if (char === '"') {
                inQuote = true;
            } else if (char === ',') {
                row.push(current);
                current = "";
            } else if (char === '\n' || char === '\r') {
                if (current || row.length > 0) row.push(current);
                if (row.length > 0) rows.push(row);
                row = [];
                current = "";
                if (char === '\r' && nextChar === '\n') i++;
            } else {
                current += char;
            }
        }
    }
    if (current || row.length > 0) {
        row.push(current);
        rows.push(row);
    }
    return rows;
  }

  async function fetchSheetData() {
    try {
        // 加入時間戳參數以避免快取問題
        const fetchUrl = `${csvUrl}&t=${new Date().getTime()}`;
        
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

        const csvText = await res.text();
        const rows = parseCSV(csvText);

        if (!rows || rows.length === 0) return;

        submissionData = {};
        const uniqueFormSources = new Set();

        // 假設第 1 列是標題，資料從第 2 列 (index 1) 開始
        // 欄位對應: A:日期(0), B:人員(1), C:檢查室(2), D:來源(3)
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (row.length < 4) continue;

            const dateRaw = row[0];    
            const personName = row[1]; 
            const room = row[2];       
            const formSource = row[3]; 
            
            const date = new Date(dateRaw);
            if (isNaN(date.getTime()) || !room || !formSource) continue;

            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const formattedDate = `${yyyy}-${mm}-${dd}`;

            uniqueFormSources.add(formSource);

            if (!submissionData[formSource]) submissionData[formSource] = {};
            if (!submissionData[formSource][formattedDate]) {
                submissionData[formSource][formattedDate] = {
                    rooms: [],
                    personnel: new Set()
                };
            }

            submissionData[formSource][formattedDate].rooms.push(room);
            if (personName && personName.trim() !== '') {
                submissionData[formSource][formattedDate].personnel.add(personName);
            }
        }

        updateDropdown([...uniqueFormSources].sort());
        renderCalendar();
    } catch (error) {
        console.error("Error fetching data:", error);
        document.getElementById('currentMonth').textContent = "讀取失敗";
        const calendarDays = document.getElementById('calendarDays');
        calendarDays.innerHTML = `<div class="col-span-7 text-center py-10 text-red-200">
            無法讀取資料，請檢查網路連線或 CSV 連結。
        </div>`;
    }
  }

  function updateDropdown(formSources) {
    const dropdown = document.getElementById('personnel');
    dropdown.innerHTML = '';
    
    if (formSources.length === 0) {
        dropdown.innerHTML = '<option>無資料</option>';
        return;
    }

    formSources.forEach(source => {
      const option = document.createElement('option');
      option.value = source;
      option.textContent = source;
      dropdown.appendChild(option);
    });

    selectedFormSource = formSources[0] || '';
    dropdown.value = selectedFormSource;
  }

  function initCalendar() {
    document.getElementById('personnel').addEventListener('change', function () {
      selectedFormSource = this.value;
      renderCalendar();
    });

    document.getElementById('prevMonth').addEventListener('click', function () {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', function () {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    fetchSheetData();
  }

  function renderCalendar() {
    if (!selectedFormSource && Object.keys(submissionData).length > 0) return;

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    document.getElementById('currentMonth').textContent = `${year}年${monthNames[month]}`;

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const firstDayOfWeek = firstDay.getDay(); 
    const daysInMonth = lastDay.getDate();
    const calendarDays = document.getElementById('calendarDays');
    calendarDays.innerHTML = '';

    // 空白日
    for (let i = 0; i < firstDayOfWeek; i++) {
      const emptyDay = document.createElement('div');
      emptyDay.className = 'calendar-day empty-day';
      calendarDays.appendChild(emptyDay);
     }

    // 渲染日期
    for (let day = 1; day <= daysInMonth; day++) {
      const calendarDateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dayElement = document.createElement('div');
      dayElement.className = 'calendar-day';

      const todayString = new Date().toISOString().split('T')[0];
      if (todayString === calendarDateString) {
        dayElement.style.backgroundColor = '#FAFFCA'; 
        dayElement.style.borderColor = '#5A827E';
        dayElement.style.borderWidth = '2px';
      }

      const dayData = submissionData?.[selectedFormSource]?.[calendarDateString];

      if (dayData && dayData.personnel.size > 0) {
          const personList = Array.from(dayData.personnel).join('、');
          
          dayElement.addEventListener('mouseenter', () => {
              tooltip.innerHTML = `填表人員：<br><span style="color:#FFF;">${personList}</span>`;
              tooltip.style.display = 'block';
          });

          dayElement.addEventListener('mousemove', (e) => {
              tooltip.style.left = e.clientX + 15 + 'px';
              tooltip.style.top = e.clientY + 15 + 'px';
          });

          dayElement.addEventListener('mouseleave', () => {
              tooltip.style.display = 'none';
          });
      }

      const dayNumber = document.createElement('div');
      dayNumber.className = 'day-number';
      dayNumber.textContent = day;
      dayElement.appendChild(dayNumber);

      const scrollContainer = document.createElement('div');
      scrollContainer.className = 'day-content-scroll hide-scrollbar';

      if (dayData && dayData.rooms.length > 0) {
        dayData.rooms.forEach(room => {
          const roomDiv = document.createElement('div');
          roomDiv.className = 'text-[12px] md:text-[13px] font-bold text-[#5A827E] bg-white/40 rounded px-1 w-full text-center leading-tight py-0.5 break-words shadow-sm mb-1'; 
          
          const match = room.match(/\((.*?)\)/);
          roomDiv.textContent = match ? match[1] : room;
          
          scrollContainer.appendChild(roomDiv);
        });
      }

      dayElement.appendChild(scrollContainer);
      calendarDays.appendChild(dayElement);
    }

    const totalCells = Math.ceil((firstDayOfWeek + daysInMonth) / 7) * 7;
    const remainingCells = totalCells - (firstDayOfWeek + daysInMonth);
    for (let i = 0; i < remainingCells; i++) {
      const emptyDay = document.createElement('div');
      emptyDay.className = 'calendar-day empty-day';
      calendarDays.appendChild(emptyDay);
    }
  }

  document.addEventListener('DOMContentLoaded', initCalendar);
})();
</script>

</body>
</html>
